---
- hosts: turing
  user: root
  strategy: free

  vars:
    # He tenido que quitar los grupos sambashare,ubridge
    # Añado tty para que puedan utilizar minicom con un cable
    grupos: adm,cdrom,dialout,kvm,libvirt,lpadmin,lxd,plugdev,tty,vboxusers

  roles:
    - delete-users
    - lock-sshd
    - swappiness-0
    - role: vasilisa
      vars:
        sirin: "http://192.168.18.18:8080/register/turing-u2604.yml"
    - activate-unattended-upgrades
    - role: cambia-hostname
      vars:
        base_hostname: "turing"
          #- chrony-sources
    - ubuntu-desktop-minimal
    - software
      #- gnome-dconf-2404
    - wireshark
    - kvm
    - lxd-dir
    - glpi-agent
    - convidat-pam
    - apagado-1455
    - apagado-2130

  tasks:
    # Usuarios
    - include_tasks: users/aig/alumnos/ga2cd.yml
    - include_tasks: users/aig/alumnos/sa2.yml
    #- include_tasks: users/informatica/alumnos/smx2a.yml
    #- include_tasks: users/informatica/alumnos/smx1c.yml
    - include_tasks: users/aig/docent.yml
      when: ansible_default_ipv4.address == "192.168.18.100"
    - include_tasks: users/aig/krississ.yml
      when: ansible_default_ipv4.address == "192.168.18.100"

