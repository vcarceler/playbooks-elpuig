---
- hosts: portatils_prestec
  user: root
  strategy: free

  vars:
    # He tenido que quitar los grupos sambashare,ubridge
    # Añado tty para que puedan utilizar minicom con un cable
    grupos: adm,cdrom,dialout,kvm,libvirt,lpadmin,lxd,plugdev,tty,vboxusers

  roles:
    - delete-users
    - lock-sshd
    - swappiness-0
    - role: vasilisa
      vars:
        sirin: "http://192.168.240.18:8080/register/portatils-prestec-u2604.yml"
    - activate-unattended-upgrades
    - role: cambia-hostname
      vars:
        base_hostname: "prestec"
          #- chrony-sources
    - ubuntu-desktop-minimal
    - software
      #- gnome-dconf-2404
    - wireshark
    - kvm
    - lxd-dir
    - glpi-agent
    - convidat-pam
    - authd
    - apagado-1455
    - apagado-2130

  tasks:
    # Usuarios
    - include_tasks: users/esobat/docent.yml

